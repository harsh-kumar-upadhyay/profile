<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="body">
    <div id="dynamic-nav" class="top-nav"></div>

    <div class="container-wrapper">
        <header class="archive-header">
            <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted);">Gallery</span>
        </header>
        <main class="gallery-grid" id="galleryContainer"></main>
    </div>

    <div id="imageModal" class="image-modal" onclick="closeModal(event)">
        <div class="modal-wrapper">
            <button id="prevBtn" class="modal-nav-btn" onclick="changeSlide(-1, event)">❮</button>
            <img id="modalImg" src="" alt="Full Size">
            <button id="nextBtn" class="modal-nav-btn" onclick="changeSlide(1, event)">❯</button>
        </div>
    </div>
    <script src="../script.js"></script>
</body>
</html>
