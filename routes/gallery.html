<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Moments</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="body">

    <div class="top-nav">
        <div class="nav-buttons">
            <button class="icon-btn" onclick="history.back()" aria-label="Go Back">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

            <a href="../index.html" class="icon-btn" aria-label="Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>
        </div>
        
        <button id="mode" class="icon-btn" onclick="myFunction()" aria-label="Toggle Dark Mode">
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>

    <div class="container-wrapper">
        <header class="archive-header">
            <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted);">Gallery</span>
        </header>

        <main class="gallery-grid" id="galleryContainer">
            </main>
    </div>
    <div id="imageModal" class="image-modal" onclick="closeModal()">
        <img id="modalImg" src="" alt="Full Size">
    </div>

    <script src="../script.js"></script>
   
   <script>
        // ============================================
        // CONFIGURATION: Add IDs and Descriptions here
        // ============================================
        const galleryItems = [
            { 
                id: "1sIPdUTSHWiZ_Uj3iy55kexjOZCkD9v3q", // Replace with actual Drive File ID
                description: "Community gathering at the main hall." 
            },
            { 
                id: "1W-y9uqaWDZdkDEdd5mP_KpahifTxsyPW", // Replace with actual Drive File ID
                description: "A memorable moment from the summer trip." 
            },
            // Add more items here...
        ];

        const container = document.getElementById('galleryContainer');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');

        const isDesktop = window.matchMedia('(hover: hover)').matches;
        
        let openTimer;  
        let closeTimer;

        galleryItems.forEach(item => {
            const imageUrl = `https://lh3.googleusercontent.com/d/${item.id}`;
            
            const card = document.createElement('div');
            card.className = 'gallery-card';
            
            const img = document.createElement('img');
            img.src = imageUrl;
            img.className = 'gallery-image';
            img.loading = "lazy";
            img.alt = item.description;
            
            img.style.width = '100%';
            img.style.height = '250px';
            img.style.objectFit = 'cover'; 
            img.style.display = 'block';
            
            // --- DESKTOP LOGIC ---
            if (isDesktop) {
                img.addEventListener('mouseenter', () => {
                    clearTimeout(closeTimer);
                    openTimer = setTimeout(() => { openModal(imageUrl); }, 400); 
                });
                
                img.addEventListener('mouseleave', () => {
                    clearTimeout(openTimer);
                    closeTimer = setTimeout(closeModal, 150); 
                });
            } 
            // --- MOBILE LOGIC ---
            else {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(imageUrl);
                });
            }

            img.oncontextmenu = (e) => { e.preventDefault(); return false; };

            const caption = document.createElement('div');
            caption.className = 'gallery-caption';
            const text = document.createElement('p');
            text.innerText = item.description;
            caption.appendChild(text);

            card.appendChild(img);
            card.appendChild(caption);
            container.appendChild(card);
        });

        // ==================================================
        // NEW ANIMATION LOGIC (THE FIX)
        // ==================================================

        function openModal(src) {
            modalImg.src = src;
            
            // 1. Make it visible to the browser (but still invisible/small)
            modal.style.display = 'flex';
            
            // 2. Force the browser to "read" the state (Reflow)
            // This forces the browser to realize: "Oh, I am currently small!"
            void modal.offsetWidth; 
            
            // 3. NOW start the animation to "Big"
            modal.classList.add('active');
        }

        function closeModal() {
            // 1. Start the animation back to "Small"
            modal.classList.remove('active');
            
            // 2. Wait for the CSS transition (0.6s) to finish, THEN hide it
            setTimeout(() => {
                modal.style.display = 'none';
                modalImg.src = '';
            }, 600); // 600ms matches the CSS transition time
        }

        if (isDesktop) {
            modal.style.pointerEvents = 'none';
            modalImg.style.pointerEvents = 'auto';

            modalImg.addEventListener('mouseenter', () => clearTimeout(closeTimer));
            modalImg.addEventListener('mouseleave', () => closeModal());
        }
    </script>

</body>
</html>
