<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="body">

    <div class="top-nav">
        <div class="nav-buttons">
            <button class="icon-btn" onclick="history.back()" aria-label="Go Back">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            
            <a href="../index.html" class="icon-btn" aria-label="Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>
        </div>
        
        <button id="mode" class="icon-btn" onclick="myFunction()" aria-label="Toggle Dark Mode">
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>

    <div class="container-wrapper">
        <header class="archive-header">
            <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted);">Gallery</span>
        </header>

        <main class="gallery-grid" id="galleryContainer">
            </main>
    </div>

    <div id="imageModal" class="image-modal" onclick="closeModal(event)">
        <div class="modal-wrapper">
            <button id="prevBtn" class="modal-nav-btn" onclick="changeSlide(-1, event)">❮</button>
            <img id="modalImg" src="" alt="Full Size">
            <button id="nextBtn" class="modal-nav-btn" onclick="changeSlide(1, event)">❯</button>
        </div>
    </div>

    <script src="../script.js"></script>

    <script src="../script.js"></script>
        
    <script>
    // ============================================
    // CONFIGURATION: Group your images here
    // ============================================
    const galleryItems = [
        { 
                // A single gallery item now has MULTIPLE images
                ids: [
                    "1katdTOV9PBGFSeT_6hR6O0ShJDMMyDmJ", // Image 1 of this event
                    "1bifTFPUC8uzzwJcAfco-jAcC1k9PIU2Q", // Image 2 of this event
                    "1a4t3ZfvHfM5k5-0xZElkZFP4tu_CBYLu"  // Image 3 of this event
                ], 
                description: "PRAYAS; Dinner with Director."
            },
	        { 
                ids: [
                    "1W17eEk0uZA36RgJ6Gc-AAddNgmn6uGAS", // Image 1 of second event
                    "1wq0JSOlEma6cVCFHSXXHJv1ESPjsoFyM"  // Image 2 of second event
                ], 
                description: "CTO with TRDDC (TCS Research) team."
            },
            { 
                ids: [
                    "1_VoevVg_Go4VyV_xGxQA0muZ3CSUoDFm", // Image 1 of second event
                    "1wfs5Y9l5RVVw2W4QMnz7WXFBpAeqCdzE",
                    "1rUZlvC4WA6wPdQNyGOzNq1EAcfATdPbq",
                    "1793G3ZqXiguboLlqNA4YxSnooLEUFO2t"
                ], 
                description: "Jadavpur University Convocation."
            },
            { 
                ids: [
                    "16M5ZwvDdnCy79lGvxsLH5JmST9q_zlFR", // Image 1 of second event
                    "1W-y9uqaWDZdkDEdd5mP_KpahifTxsyPW"  // Image 2 of second event
                ], 
                description: "IIT Madras Provisional Certificate Distribution." 
            },
    ];

    const container = document.getElementById('galleryContainer');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Portal Fix
    document.body.appendChild(modal);

    // --- DISABLE RIGHT CLICK ON ENLARGED IMAGE ---
    modalImg.addEventListener('contextmenu', (e) => {
        e.preventDefault(); 
        return false;
    });

    const isDesktop = window.matchMedia('(hover: hover)').matches;
    let openTimer;  
    let closeTimer;
    let currentModalImages = []; 
    let currentModalIndex = 0;   

    // BUILD GALLERY
    galleryItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        const imageStack = document.createElement('div');
        imageStack.className = 'image-stack';
        
        item.ids.forEach((id, index) => {
            const img = document.createElement('img');
            img.src = `https://lh3.googleusercontent.com/d/${id}`; 
            img.className = `gallery-image ${index === 0 ? 'visible' : ''}`;
            img.loading = "lazy";
            
            // --- DISABLE RIGHT CLICK ON THUMBNAILS ---
            img.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                return false;
            });

            imageStack.appendChild(img);
        });

        if (item.ids.length > 1) startCardSlideshow(imageStack, item.ids.length);

        // INTERACTION
        if (isDesktop) {
            imageStack.addEventListener('mouseenter', () => {
                clearTimeout(closeTimer);
                openTimer = setTimeout(() => { openModal(item.ids); }, 400); 
            });
            imageStack.addEventListener('mouseleave', () => {
                clearTimeout(openTimer);
                closeTimer = setTimeout(closeModal, 150); 
            });
        } else {
            imageStack.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(item.ids);
            });
        }

        const caption = document.createElement('div');
        caption.className = 'gallery-caption';
        caption.innerHTML = `<p>${item.description}</p>`;
        card.appendChild(imageStack);
        card.appendChild(caption);
        container.appendChild(card);
    });

    function startCardSlideshow(stackElement, count) {
        let currentIndex = 0;
        const images = stackElement.querySelectorAll('img');
        setInterval(() => {
            images[currentIndex].classList.remove('visible');
            currentIndex = (currentIndex + 1) % count;
            images[currentIndex].classList.add('visible');
        }, 3000); 
    }

    // MODAL LOGIC
    function openModal(imageIds) {
        currentModalImages = imageIds;
        currentModalIndex = 0; 
        updateModalImage();
        
        if (imageIds.length > 1) {
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
        } else {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        }

        modal.style.display = 'flex';
        void modal.offsetWidth; // Force reflow
        modal.classList.add('active');
    }

    function updateModalImage() {
        modalImg.src = `https://lh3.googleusercontent.com/d/${currentModalImages[currentModalIndex]}`;
    }

    function changeSlide(direction, event) {
        if(event) event.stopPropagation();
        currentModalIndex += direction;
        if (currentModalIndex >= currentModalImages.length) currentModalIndex = 0;
        else if (currentModalIndex < 0) currentModalIndex = currentModalImages.length - 1;
        updateModalImage();
    }

    function closeModal(event) {
        if (event && event.target !== modal) return;
        modal.classList.remove('active');
        setTimeout(() => {
            modal.style.display = 'none';
            modalImg.src = '';
            currentModalImages = [];
        }, 500); 
    }

    // --- SAFE ZONE LOGIC ---
    if (isDesktop) {
        modal.style.pointerEvents = 'none'; 

        // Treat the Image AND Buttons as a single "Safe Zone"
        const safeElements = [modalImg, prevBtn, nextBtn];
        
        safeElements.forEach(el => {
            el.style.pointerEvents = 'auto'; 
            
            el.addEventListener('mouseenter', () => {
                clearTimeout(closeTimer);
            });
            
            el.addEventListener('mouseleave', () => {
                closeTimer = setTimeout(closeModal, 300);
            });
        });
    } else {
        modal.style.pointerEvents = 'auto';
    }
</script>
</body>
</html>
