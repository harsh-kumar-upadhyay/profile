<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="body">
    <div id="dynamic-nav" class="top-nav"></div>

    <div class="container-wrapper">
        <header class="archive-header">
            <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted);">Calendar & Updates</span>
            <h1 id="calendar-title" style="margin-top: 10px; cursor: pointer;">Year View</h1>
        </header>

        <main id="calendar-container" class="calendar-wrapper"></main>
    </div>

    <div id="dayModal" class="image-modal" onclick="closeDayModal(event)">
        <div class="modal-wrapper" style="background: var(--card-bg); padding: 30px; border-radius: 8px; max-width: 500px; width: 90%;">
            <h2 id="modalDate" style="margin-top: 0;"></h2>
            <p id="modalContent" style="color: var(--text-muted);"></p>
        </div>
    </div>
    <script>
        const CALENDAR_DATA = {
            2026: {
                summary: "Starting my second semester as TA for AI (ID1050). Deepening research focus.",
                months: {
                    0: { // January (0-indexed)
                        summary: "Back to campus. Setting up the lab.",
                        days: {
                            15: "First lecture of the semester.",
                            26: "Republic Day Parade at IITH."
                        }
                    },
                    1: { // February
                        summary: "Working on submissions.",
                        days: {
                            5: "Discussed Bayes Risk with Prof. Saketha.",
                            8: "Fixed CSS issues on the portfolio site."
                        }
                    }
                }
            },
            2025: {
                summary: "Joined PhD program. Completed courseworks.",
                months: {
                    6: { // July
                        summary: "Official joining date.",
                        days: {
                            24: "Orientation day."
                        }
                    }
                }
            }
        };

        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    </script>
    <script src="../script.js"></script>
</body>
</html>
