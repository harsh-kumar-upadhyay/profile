<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhagavad Gita 4.34 — Shloka</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="back-btn">← Back</a>
        <div class="nav-buttons">
            <button id="replay-btn" class="button" type="button">Replay</button>
            <button id="mode" class="icon-btn" type="button" aria-label="Toggle Dark Mode" aria-pressed="false">
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <main class="shloka-page">
        <div class="shloka-card">
            <p class="shloka-ref">Bhagavad Gita 4.34</p>
            <div class="shloka-heading-row">
                <h1 class="shloka-sanskrit">तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया । उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ॥</h1>
                <button id="shloka-play-btn" type="button" aria-label="Play Shloka Audio" title="Listen to recitation">▶</button>
            </div>
            <p class="shloka-translit">tad viddhi praṇipātena paripraśnena sevayā | upadekṣyanti te jñānaṁ jñāninas tattva-darśinaḥ ||</p>
            <audio id="shloka-audio" src="../assets/Shloka_Moto.mp3" preload="metadata"></audio>
            <h2 class="meaning-heading">Meaning</h2>
            <p class="typed-meaning" style="white-space: pre-line;">
                <span id="meaning-text"></span><span id="cursor" class="typing-cursor"></span>
            </p>
        </div>
    </main>

    <script>
        // Sync dark mode if saved on the main site
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }

        const meaningText = `Krishna opens with tad ("that") viddhi ("know/understand"): The ignorance has blind spots it cannot see on its own, ultimate knowledge cannot be cracked by solitary intellect, it must be received from an outside mirror.

                            How to Receive It (Praṇipātena, Paripraśnena, Sevayā): To make yourself capable of receiving this wisdom, you approach through three conditions:
                            - Praṇipātena (by humility): Lowering the ego so you stop defending what you already think as the ultimate knowledge.
                            - Paripraśnena (by thorough questioning): Testing and clarifying sincere doubts from every angle, never blind acceptance.
                            - Sevayā (by service): Acting without self-interest, which aligns your actions with your intent and builds real receptivity.

                            The Teacher & Transmission (Upadekṣyanti Te Jñāninas Tattva-Darśinaḥ): Knowledge can only come from those who are both established in theory (jñāninaḥ) and lived the practical (tattva-darśinaḥ). When a receptive student meets such a guide, they will point out/instruct unto you ("upadekṣyanti te") that truth—not by pouring information into your head, but by guiding you until you see it for yourself.`;

        const textEl = document.getElementById("meaning-text");
        const cursorEl = document.getElementById("cursor");
        const replayBtn = document.getElementById("replay-btn");

        let index = 0;
        let timerId = null;
        const speedMs = 20; // Adjusted slightly faster for the longer text

        function typeMeaning() {
            clearTimeout(timerId);
            index = 0;
            textEl.textContent = "";
            cursorEl.classList.remove("done");

            function step() {
                if (index < meaningText.length) {
                    textEl.textContent += meaningText.charAt(index);
                    index++;
                    timerId = setTimeout(step, speedMs);
                } else {
                    cursorEl.classList.add("done");
                }
            }

            step();
        }

        replayBtn.addEventListener("click", typeMeaning);
        window.addEventListener("DOMContentLoaded", typeMeaning);
    </script>
    <footer class="copyright-corner">
        <img class="footer-ico" src="../assets/favicon.ico" alt="Site Icon" width="16" height="16">
        <span>© 2026 Copyright Holder. All rights reserved.</span>
    </footer>
    <script src="../script.js"></script>
    <script>
        const themeButton = document.getElementById("mode");
        const moonIcon = themeButton.querySelector(".moon-icon");
        const sunIcon = themeButton.querySelector(".sun-icon");

        function updateThemeButton() {
            const isDark = document.body.classList.contains("dark-mode");
            themeButton.setAttribute("aria-pressed", String(isDark));
            moonIcon.style.display = isDark ? "none" : "block";
            sunIcon.style.display = isDark ? "block" : "none";
        }

        themeButton.addEventListener("click", () => {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            updateThemeButton();
        });

        updateThemeButton();
    </script>
</body>
</html>
