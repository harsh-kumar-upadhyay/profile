<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhagavad Gita 4.34 — Shloka</title>
    <link rel="stylesheet" href="../styles.css" />
</head>
<body>
    <div class="top-nav">
        <a href="../index.html" class="back-btn">← Back</a>
        <div class="nav-buttons">
            <button id="replay-btn" class="button" type="button">Replay</button>
        </div>
    </div>

    <main class="shloka-page">
        <div class="shloka-card">
            <p class="shloka-ref">Bhagavad Gita 4.34</p>
            <h1 class="shloka-sanskrit">तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया । उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ॥</h1>
            <p class="shloka-translit">tad viddhi praṇipātena paripraśnena sevayā | upadekṣyanti te jñānaṁ jñāninas tattva-darśinaḥ ||</p>

            <h2 class="meaning-heading">Meaning</h2>
            <p class="typed-meaning" style="white-space: pre-line;">
                <span id="meaning-text"></span><span id="cursor" class="typing-cursor"></span>
            </p>
        </div>
    </main>

    <script>
        // Sync dark mode if saved on the main site
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }

        const meaningText = `Krishna opens with tad ("that") viddhi ("know/understand"), building up to jñānam ("wisdom/knowledge") in the second half. The core logic is simple: because the ego has blind spots it cannot see on its own, ultimate truth cannot be cracked by solitary intellect—it must be received from an outside mirror.

How to Receive It (Praṇipātena, Paripraśnena, Sevayā): To make yourself capable of receiving this wisdom, you approach through three conditions:
- Praṇipātena (by humility): Lowering the ego so you stop defending what you already think you know.
- Paripraśnena (by thorough questioning): Testing and clarifying doubts from every angle—real inquiry, never blind obedience.
- Sevayā (by service): Acting without self-interest, which aligns your actions with your intent and builds real receptivity.

The Teacher & Transmission (Upadekṣyanti Te Jñāninas Tattva-Darśinaḥ): Knowledge can only come from those who are both jñāninaḥ (established in wisdom) and tattva-darśinaḥ (direct seers of reality—not mere book scholars). When a receptive student meets such a guide, upadekṣyanti te ("they will point out/instruct unto you") that truth—not by pouring information into your head, but by guiding your vision until you see it for yourself.`;

        const textEl = document.getElementById("meaning-text");
        const cursorEl = document.getElementById("cursor");
        const replayBtn = document.getElementById("replay-btn");

        let index = 0;
        let timerId = null;
        const speedMs = 14; // Adjusted slightly faster for the longer text

        function typeMeaning() {
            clearTimeout(timerId);
            index = 0;
            textEl.textContent = "";
            cursorEl.classList.remove("done");

            function step() {
                if (index < meaningText.length) {
                    textEl.textContent += meaningText.charAt(index);
                    index++;
                    timerId = setTimeout(step, speedMs);
                } else {
                    cursorEl.classList.add("done");
                }
            }

            step();
        }

        replayBtn.addEventListener("click", typeMeaning);
        window.addEventListener("DOMContentLoaded", typeMeaning);
    </script>
</body>
</html>
